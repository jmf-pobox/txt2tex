    ## 1. Dependabot

    The weekly "pip" version-update jobs run green but never open PRs, because
    the project has `dependencies = []` and keeps dev tools in PEP 735
    [dependency-groups] locked in uv.lock — which the pip ecosystem does not read.
    Only security updates (branch prefix dependabot/uv/) have arrived (PR #108).
    Switch the Python entry to `package-ecosystem: "uv"`. Keep schedule, limits,
    commit-message prefix, and labels. Consider adding a `groups:` block so dev
    tools arrive as one PR rather than five — do it if simple, note it either way.

    ## 2. Lockfile and floors

    `uv lock --upgrade`, then `uv sync`. Raise dev-group floors as in the success
    criteria. Leave the complexity group's existing comments intact (gitpython
    floor stays >=3.1.58 or higher).

    ## 3. ruff 0.17 formats Python code blocks inside Markdown

    ruff 0.17 now formats ```python fences in .md files. Decision (from the
    student, jfreeman): accept this in general, exclude specific files where
    formatting degrades the doc. jra reviewed every diff:

    - ACCEPT (reformat): docs/DESIGN.md, docs/PHASE1-PLAN.md,
      docs/guides/PROOF_SYNTAX.md — PEP 8 blank lines, collapsed comment
      alignment, quote normalization. Harmless.
    - EXCLUDE:
      - docs/development/RESERVED_WORDS.md — a compact keyword set explodes
        from 5 lines to 33.
      - docs/guides/FUZZ_VS_STD_LATEX.md — function_like_ops set explodes from
        3 lines to 15.
      - docs/development/judge-prompt.md — pseudo-code with prose inside a
        string; reformat yields mismatched indentation.
      - .punt-labs/ — ethos-managed content (talents), not ours to reformat.

    Put the exclusions in `[tool.ruff.format] exclude = [...]` in pyproject.toml.
    Verify with `uv run ruff format --check .` that exactly those four are
    skipped and nothing else would change. After formatting the three accepted
    docs, run markdownlint (part of make check) — the reformatted fences must
    still pass. Read each reformatted block once to confirm it still reads
    correctly as documentation.

