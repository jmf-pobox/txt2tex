    ## Fix 1 — ruff ISC004, src/txt2tex/lexer.py:279

    In the `details = [...]` list, the first element is two implicitly
    concatenated f-strings. That is intended (one message line). Wrap the two
    f-strings in parentheses so ruff 0.17 ISC004 is satisfied. Same runtime
    string. Grep the whole of src/ and tests/ for any other ISC004 instance
    (ruff 0.17 reported only this one, but confirm).

    ## Fix 2 — pyright reportDeprecated, src/txt2tex/repl.py:299

    The `.clear` REPL command calls
    `os.system("clear" if platform.system() != "Windows" else "cls")  # noqa: S605`.
    pyright 1.1.414 flags os.system as deprecated. Replace with
    subprocess.run using an argument list, no shell=True:
      - non-Windows: ["clear"]
      - Windows: ["cmd", "/c", "cls"]   (cls is a cmd builtin, not an executable;
        ["cls"] alone would raise FileNotFoundError)
    Use check=False (a failing clear must not crash the REPL). Keep any noqa
    narrowly scoped to the specific ruff rules that fire (likely S603/S607) and
    only if they fire. Remove the `os` / `platform` imports only if they become
    unused. Imports at top of file, per project rules.

    TDD: write a test in tests/test_repl.py that drives the REPL with `.clear`
    input and monkeypatches subprocess.run, asserting the exact argv for the
    current platform (and, via monkeypatching platform.system, for Windows).
    Run it, show it fails against the current os.system code, then implement.

    Rules: edit each file by hand with Edit — no sed/awk/perl -i/scripted
    substitutions. Full type annotations; mypy and pyright strict.

    Record your result in .tmp/missions/deps-code-fixes-result.yaml and via
    `ethos mission result`.
